name: Authoring integrity

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: authoring-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  authoring-integrity:
    name: Authoring integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Use the project Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          report_path="$RUNNER_TEMP/authoring-integrity.json"
          set +e
          npm --silent run validate:branch -- --base "$BASE_SHA" --head HEAD | tee "$report_path"
          status=${PIPESTATUS[0]}
          set -e
          {
            echo '## Authoring integrity'
            echo
            echo '```json'
            cat "$report_path"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Publish the current report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: authoring-integrity
          path: ${{ runner.temp }}/authoring-integrity.json
          if-no-files-found: error
          retention-days: 7
